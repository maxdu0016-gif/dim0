name: Dim0Native

options:
  bundleIdPrefix: com.dim0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: N9SR79J574

targets:
  Dim0Native:
    type: application
    platform: iOS
    sources:
      - path: ../Dim0Native
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dim0.canvas
        PRODUCT_MODULE_NAME: Dim0Native
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dim0
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "用于在同一 Wi-Fi 下把 iPad 笔迹同步到电脑上的 Dim0 画布。"
        INFOPLIST_KEY_NSBonjourServices: "_dim0sync._tcp"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "3"
        MARKETING_VERSION: "1.1.1"
    scheme:
      testTargets:
        - Dim0NativeTests

  Dim0NativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Dim0NativeTests
    dependencies:
      - target: Dim0Native
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dim0.canvas.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
