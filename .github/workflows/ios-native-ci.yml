name: iOS native CI

on:
  push:
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native-ci.yml"
  pull_request:
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios-native/ios

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Persist generated Xcode project
        if: github.ref == 'refs/heads/codex/ipad-native-pencilkit' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Dim0Native.xcodeproj
          if ! git diff --cached --quiet; then
            git commit -m "build(ios): generate xcode project"
            git push
          fi

      - name: Export generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: Dim0Native-xcodeproj
          path: ios-native/ios/Dim0Native.xcodeproj
          if-no-files-found: error

      - name: Compile app and tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Dim0Native.xcodeproj \
            -scheme Dim0Native \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived-data \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
